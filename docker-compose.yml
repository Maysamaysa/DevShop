version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devshop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devshop
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devshop" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      args:
        APP_NAME: api-gateway
    container_name: devshop-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - ORDER_SERVICE_URL=http://order-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003
    depends_on:
      - auth-service
      - order-service
      - notification-service

  auth-service:
    build:
      context: .
      args:
        APP_NAME: auth-service
    container_name: devshop-auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=devshop
      - DB_PASSWORD=password
      - DB_NAME=devshop
      - JWT_SECRET=super_secret_jwt_key
      - JWT_REFRESH_SECRET=super_secret_refresh_key
      - JWT_REFRESH_EXPIRATION=7d
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        APP_NAME: order-service
    container_name: devshop-order-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=devshop
      - DB_PASSWORD=password
      - DB_NAME=devshop
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      args:
        APP_NAME: notification-service
    container_name: devshop-notification-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=devshop
      - DB_PASSWORD=password
      - DB_NAME=devshop
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

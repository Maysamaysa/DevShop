services:
  postgres:
    image: postgres:15-alpine
    container_name: devshop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: devshop
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U devshop" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: devshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: devshop-grafana
    ports:
      - "3004:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:latest
    container_name: devshop-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  api-gateway:
    build:
      context: .
      args:
        APP_NAME: api-gateway
    container_name: devshop-api-gateway
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - auth-service
      - order-service
      - notification-service
      - infra-service
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      args:
        APP_NAME: auth-service
    container_name: devshop-auth-service
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - PORT=3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .
      args:
        APP_NAME: order-service
    container_name: devshop-order-service
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      - PORT=3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      args:
        APP_NAME: notification-service
    container_name: devshop-notification-service
    ports:
      - "3003:3003"
    env_file: .env
    environment:
      - PORT=3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  infra-service:
    build:
      context: .
      args:
        APP_NAME: infra-service
    container_name: devshop-infra-service
    ports:
      - "3005:3005"
    env_file: .env
    environment:
      - PORT=3005
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  grafana_data:

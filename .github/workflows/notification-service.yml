name: Notification Service Deployment

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/notification-service/**'
      - 'libs/**'
      - 'Dockerfile'
      - '.github/workflows/notification-service.yml'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: devshop-notification-service
  APP_NAME: notification-service

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci

  build-scan-push:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha

    - name: Build image for scanning
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: localbuild/image:latest
        build-args: |
          APP_NAME=${{ env.APP_NAME }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'localbuild/image:latest'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }},${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APP_NAME=${{ env.APP_NAME }}

  deploy:
    needs: build-scan-push
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Helm
      uses: azure/setup-helm@v4.2.0
    
    - name: Deploy Notification Service Chart
      run: |
        echo "Simulating Helm upgrade for Notification Service..."
        # helm upgrade --install notification-service ./helm/notification-service \
        #   --namespace devshop --create-namespace \
        #   --set image.tag=sha-${GITHUB_SHA::7}

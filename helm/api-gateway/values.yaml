replicaCount: 1

image:
  repository: devshop-api-gateway
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 3000

env:
  - name: PORT
    value: "3000"
  - name: AUTH_SERVICE_URL
    value: "http://auth-service-devshop-auth-service:3001"
  - name: ORDER_SERVICE_URL
    value: "http://order-service-devshop-order-service:3002"
  - name: NOTIFICATION_SERVICE_URL
    value: "http://notification-service-devshop-notification-service:3003"
  - name: INFRA_SERVICE_URL
    value: "http://infra-service-devshop-infra-service:3005"

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: api-gateway.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
